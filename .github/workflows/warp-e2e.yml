name: warp-e2e

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bake:
    name: bake on a WarpBuild remote builder
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # No api-key: on a WarpBuild runner the action authenticates with
      # WARPBUILD_RUNNER_VERIFICATION_TOKEN. No WARPBUILD_API_DOMAIN either,
      # so the client uses its default of https://api.warpbuild.com.
      - name: Bake
        id: bake
        uses: ./
        with:
          files: ./__tests__/warp-e2e.hcl
          profile-name: super-fast-builder
          set: |
            default.args.MARKER=warp-e2e

      - name: Assert the build ran on a remote builder, not a local one
        shell: bash
        run: |
          docker buildx inspect | tee /tmp/builder.txt
          grep -qiE '^name:[[:space:]]+builder-' /tmp/builder.txt \
            || { echo "current builder is not the one this action created"; exit 1; }
          grep -qiE '^driver:[[:space:]]+remote' /tmp/builder.txt \
            || { echo "expected the remote driver; the build did not use WarpBuild"; exit 1; }
          grep -qE 'tcp://' /tmp/builder.txt \
            || { echo "expected a tcp:// endpoint on the builder node"; exit 1; }

      # Builder profiles cache layers automatically, so an identical rebake
      # must reuse them and produce the same image digest.
      - name: Bake again
        id: rebake
        uses: ./
        with:
          files: ./__tests__/warp-e2e.hcl
          profile-name: super-fast-builder
          set: |
            default.args.MARKER=warp-e2e

      - name: Assert layer reuse produced an identical image
        shell: bash
        env:
          FIRST: ${{ steps.bake.outputs.metadata }}
          SECOND: ${{ steps.rebake.outputs.metadata }}
        run: |
          a=$(printf '%s' "$FIRST"  | jq -r '.default["containerimage.digest"] // empty')
          b=$(printf '%s' "$SECOND" | jq -r '.default["containerimage.digest"] // empty')
          echo "first:  $a"
          echo "second: $b"
          if [ -z "$a" ]; then
            echo "bake produced no containerimage.digest in its metadata"
            exit 1
          fi
          if [ "$a" != "$b" ]; then
            echo "identical rebake produced a different digest; layers were not reused"
            exit 1
          fi
